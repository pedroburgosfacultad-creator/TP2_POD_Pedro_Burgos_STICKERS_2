alizarla.","input \xB7 reintentos \xB7 rutas \xB7 regex"],"fuentes.py":["Obtener rutas","Define un contrato com\xFAn para cargar archivos desde una carpeta o desde una selecci\xF3n JSON.","ABC \xB7 herencia \xB7 polimorfismo"],"lectura.py":["Entender im\xE1genes","Comprueba el formato real y transforma p\xEDxeles en mediciones. Separa im\xE1genes v\xE1lidas y errores por archivo.","Pillow \xB7 EXIF \xB7 RGBA \xB7 ImagenSticker"],"evaluacion.py":["Aplicar reglas","Calcula PPI y dimensiones f\xEDsicas; combina advertencias y agrega estad\xEDsticas. No decide la calidad visual.","funciones \xB7 diccionarios \xB7 porcentajes"],"informes.py":["Comunicar datos","Escribe una tabla CSV y prepara el texto compartido por la terminal y el informe HTML.","csv.DictWriter \xB7 UTF-8 BOM \xB7 precisi\xF3n"],"galeria.py":["Facilitar decisiones","Crea miniaturas y un HTML local con b\xFAsqueda, filtros y selecci\xF3n manual. El HTML usa datos en memoria, no lee el CSV.","HTML \xB7 CSS \xB7 JavaScript \xB7 escape"],"seleccion.py":["Preparar originales","Valida una selecci\xF3n y copia sus im\xE1genes a una carpeta nueva para usarlas manualmente en PhotoRoom.","JSON \xB7 copias \xB7 validaci\xF3n de rutas"]},Ey={main:["Recibe argumentos CLI o solicita una configuraci\xF3n guiada.","Construye una fuente, llama analizar_fuente(), eval\xFAa cada imagen y genera resumen, CSV y galer\xEDa. La opci\xF3n de copia sale por un camino separado.","Devuelve 0 sin rechazos, 1 si hay archivos rechazados, 2 ante error global y 130 por cancelaci\xF3n. Puede haber advertencias y salida 0."],FuenteImagenes:["Recibe una ruta de origen.","Hereda de ABC. @abstractmethod obliga a las clases concretas a implementar cargar(). No se puede instanciar directamente.","Ofrece una interfaz com\xFAn \xFAtil: el an\xE1lisis necesita rutas y desconoce c\xF3mo se obtuvieron."],"FuenteImagenes.__init__":["Recibe ruta como texto o Path.","La normaliza con Path y la conserva en self.ruta.","Inicializa el atributo compartido por ambas fuentes. No lee datos todav\xEDa."],"FuenteImagenes.cargar":["Utiliza la ruta de la instancia concreta.","Define el contrato abstracto: devolver una lista de Path o lanzar una excepci\xF3n si la fuente no es v\xE1lida.","El pass no carga im\xE1genes: las subclases deben implementar este comportamiento."],FuenteCarpeta:["Recibe la carpeta a analizar, mediante el constructor heredado.","Especializa FuenteImagenes para un directorio del sistema de archivos.","Su cargar() puede sustituirse por el de la fuente JSON sin cambiar las reglas PPI."],"FuenteCarpeta.cargar":["Usa self.ruta.","Delega en buscar_archivos(); no filtra formatos de imagen todav\xEDa.","Devuelve todos los archivos del primer nivel en orden estable."],FuenteSeleccionJSON:["Recibe el archivo de selecci\xF3n, mediante el constructor heredado.","Especializa el contrato para una lista elegida en el informe HTML.","Permite reanalizar solo esos originales con nuevos par\xE1metros."],"FuenteSeleccionJSON.cargar":["Usa un JSON con version, carpeta y archivos.","Valida con leer_seleccion(); dict.fromkeys elimina nombres repetidos conservando el orden. Une cada nombre con la carpeta.","Devuelve rutas. No lee mediciones antiguas ni copia im\xE1genes."],buscar_archivos:["Recibe una carpeta.","Verifica que exista y sea un directorio; recorre iterdir(), conserva is_file() y ordena por casefold() y nombre.","Devuelve lista de Path. No recorre subcarpetas; PDF y TXT llegan al an\xE1lisis para quedar registrados."],leer_seleccion:["Recibe la ruta de un JSON.","Lee bytes, decodifica UTF-8 con BOM opcional, valida estructura, versi\xF3n 1, origen absoluto, lista no vac\xEDa y nombres sin separadores peligrosos.","Devuelve (origen, nombres, contenido_original). Compartida por copia y rean\xE1lisis. Que el origen exista no garantiza que cada archivo siga all\xED."],ImagenSticker:["Recibe ruta, ancho, alto, histograma alpha, caja visible y formato.","Agrupa mediciones del dominio y m\xE9todos para interpretar el \xE1rea visible y la transparencia.","Es una clase de imagen; no es una fuente de datos ni almacena todos los p\xEDxeles del lote."],"ImagenSticker.__init__":["Recibe las mediciones producidas por Pillow.","Guarda seis atributos; ruta se normaliza a Path. self identifica la instancia actual.","Cada imagen v\xE1lida tiene su propio estado. No hace copias de archivos."],"ImagenSticker.dimensiones_visibles":["Usa caja_visible: (izquierda, arriba, derecha, abajo).","Resta derecha \u2212 izquierda y abajo \u2212 arriba. Si la caja es None, devuelve (0, 0).","Las dimensiones son del rect\xE1ngulo envolvente, no la cantidad de p\xEDxeles visibles ni un recorte guardado."],"ImagenSticker.porcentajes_alpha":["Usa ancho_px \xD7 alto_px y las 256 posiciones del histograma.","alpha 0 cuenta transparentes; alpha 1\u2026254 cuenta parciales; visibles = total \u2212 transparentes.","Devuelve dos porcentajes con bases distintas: total/lienzo y parcial/visibles. Sin visibles, parcial = 0 por convenci\xF3n."],leer_imagen:["Recibe una ruta PNG/JPEG.","Contrasta extensi\xF3n y contenido, rechaza animaci\xF3n, verify() comprueba integridad; reabre con load(), aplica EXIF y convierte a RGBA en memoria. Obtiene histograma y getbbox() del alpha.","Devuelve ImagenSticker. Traduce fallos de Pillow a ValueError comprensibles. with cierra recursos; nunca guarda el original."],analizar_carpeta:["Recibe carpeta y etapa, final por defecto.","Construye FuenteCarpeta y delega en analizar_fuente().","Es un atajo compatible con usos previos; no duplica la l\xF3gica del an\xE1lisis."],analizar_fuente:["Recibe cualquier fuente que cumpla cargar() y una etapa v\xE1lida.","Aplica regex de extensi\xF3n, exige PNG en final y lee cada ruta dentro de try/except. La carga de la fuente est\xE1 fuera de ese try.","Devuelve (imagenes, errores). Fallo por archivo: contin\xFAa. Fuente inv\xE1lida: falla globalmente antes de exportar."],validar_lado:["Recibe lado_cm.","Comprueba math.isfinite y el intervalo inclusivo 0,1\u202656.","Lanza ValueError si no es v\xE1lido. 0,1 cm es un criterio pr\xE1ctico del proyecto; 56 cm es el m\xE1ximo de plantilla indicado."],validar_parametros:["Recibe lado_cm, ppi_minimos y umbral_parcial.","Reutiliza validar_lado; exige PPI positivo y finito, y porcentaje finito entre 0 y 100.","Evita divisi\xF3n inv\xE1lida y reglas incoherentes. Se usa en CLI y en evaluaci\xF3n directa."],evaluar_imagen:["Recibe ImagenSticker, tama\xF1o, referencia PPI, umbral, aviso de opacidad y etapa.","Elige lienzo o caja visible; calcula PPI y proporciones; agrega todas las advertencias aplicables, sin redondear antes de comparar.","Devuelve un diccionario de 22 campos. Vac\xEDo visible: no calcula PPI. FORMATO_NO_PREPARADO protege llamadas directas; el flujo normal ya rechaza JPEG en final."],resumir_resultados:["Recibe lista de resultados y lista de errores.","Cuenta estados y acumula motivos en un diccionario. encontrados = le\xEDdos + errores.","Porcentaje para revisar = revisar/le\xEDdos \xD7 100. Sin le\xEDdos devuelve None; motivos superpuestos no se suman como im\xE1genes diferentes."],texto_resumen:["Recibe resumen, par\xE1metros, origen y etapa.","Construye una lista de l\xEDneas con cifras, reglas y l\xEDmites, y la une con saltos de l\xEDnea.","Texto compartido en terminal y HTML. No se genera un archivo TXT."],guardar_informes:["Recibe resultados, errores y carpeta de salida.","Crea un directorio \xFAnico con fecha y microsegundos; DictWriter escribe encabezado y filas. Copia cada diccionario antes de formatearlo.","CSV con ;, UTF-8 BOM y hasta cuatro decimales. Las filas rechazadas solo completan archivo, estado y error. Devuelve destino absoluto."],crear_galeria:["Recibe im\xE1genes, resultados, errores, resumen, texto, destino y etapa.","Ordena tarjetas priorizando revisi\xF3n; crea miniaturas de hasta 240 px; escapa texto HTML y sustituye marcadores una sola vez. Incorpora filtros y descarga JSON en JavaScript.","Devuelve (ruta_html, notas). Un fallo de miniatura conserva la tarjeta. Recargar pierde selecci\xF3n; filtrar no la borra. PLANTILLA contiene CSS y JavaScript fuera del cuerpo de la funci\xF3n."],preparar_photoroom:["Recibe selecci\xF3n JSON y directorio de resultados.","Valida con leer_seleccion, crea carpeta \xFAnica y archiva bytes exactos del JSON. Deduplica nombres, rechaza enlaces/rutas fuera de origen y copia en modo exclusivo xb.","Devuelve destino, copiados y errores; contin\xFAa ante faltantes. El JSON indica intenci\xF3n, no confirma todas las copias. No convierte, mueve ni quita fondos."],mostrar_preparacion:["Recibe JSON y directorio.","Llama preparar_photoroom y presenta conteos, fallos y rutas en terminal.","Devuelve 1 si hubo errores de copia; 0 si no. Separa trabajo de presentaci\xF3n."],pedir_carpeta:["Solicita una ruta por input().","Quita comillas envolventes, expande ~ y repite hasta encontrar un directorio.","Devuelve Path v\xE1lido; Ctrl+C se propaga a main."],pedir_numero:["Recibe pregunta, predeterminado y si es porcentaje.","Acepta coma o punto decimal, Enter usa el valor propuesto; rechaza no finitos y valores fuera de dominio.","Devuelve float. Positivo normalmente; 0\u2026100 para porcentajes."],pedir_tamano:["Recibe tama\xF1o predeterminado.","Combina pedir_numero y validar_lado con reintentos.","Devuelve un tama\xF1o entre 0,1 y 56 inclusive."],pedir_si_no:["Recibe pregunta y valor predeterminado.","Normaliza respuestas; acepta s, si, s\xED, n, no y Enter.","Devuelve bool; repite ante texto no reconocido."],pedir_apertura:["No requiere argumentos.","Reutiliza pedir_si_no para preguntar si se abrir\xE1 el informe.","Devuelve una preferencia; no abre todav\xEDa el navegador."],pedir_etapa:["Recibe etapa predeterminada y si permite acciones extra.","Muestra inicial/final y, si corresponde, copiar/reanalizar. Repite ante una opci\xF3n inv\xE1lida.","Devuelve inicial, final, seleccion o reanalizar."],configurar_guiado:["Recibe valores iniciales para tama\xF1o, PPI, umbral, transparencia y etapa.","Conduce el men\xFA; el rean\xE1lisis pide JSON y luego etapa; la copia retorna temprano. Solo pregunta reglas alpha en final.","Devuelve diccionario que main incorpora a los argumentos; mantiene input(), no un editor especial de teclado."],abrir_informe:["Recibe ruta de informe.html.","Convierte a URI absoluta y solicita apertura con webbrowser; captura fallos.","Devuelve bool y ofrece apertura manual si falla. No valida visualmente la p\xE1gina."],carpeta_descargas:["Consulta el entorno del sistema operativo.","En Windows lee User Shell Folders del registro y expande variables; ante fallo usa Path.home()/Downloads.","Devuelve la ubicaci\xF3n probable. Una carpeta personalizada del navegador puede requerir ruta manual."],buscar_selecciones:["Recibe carpeta de b\xFAsqueda.","Regex reconoce seleccion_photoroom.json y copias como seleccion_photoroom (1).json. Obtiene fecha de modificaci\xF3n y ordena de m\xE1s reciente a m\xE1s antigua.","Devuelve pares (ruta, fecha). No inspecciona el contenido JSON aqu\xED."],pedir_seleccion:["Permite elegir una descarga o pegar la ruta.","Lista coincidencias numeradas, valida \xEDndice o existencia del archivo .json y repite si falla.","Devuelve Path. La validaci\xF3n estructural ocurre despu\xE9s en leer_seleccion."]},vr=[{title:"Elegir la entrada",file:"fuentes.py",symbol:"FuenteImagenes",code:"fuente.cargar()",body:"Una carpeta completa o una selecci\xF3n JSON producen el mismo tipo de dato: una lista de rutas. El resto del programa no necesita conocer la fuente concreta.",input:"Carpeta / JSON",output:"list[Path]",example:"sticker.png \xB7 foto.jpg \xB7 documento.pdf"},{title:"Leer y validar",file:"lectura.py",symbol:"analizar_fuente",code:"imagenes, errores = analizar_fuente(fuente, etapa)",body:"Primero se comprueba extensi\xF3n y etapa. Pillow comprueba el contenido, la integridad y la orientaci\xF3n EXIF. Un archivo incompatible se registra y el lote contin\xFAa.",input:"Rutas + etapa",output:"ImagenSticker[] + errores[]",example:"El PDF no se abre; el JPEG se admite solo en inicial."},{title:"Transformar en memoria",file:"lectura.py",symbol:"leer_imagen",code:"alpha.histogram() \xB7 alpha.getbbox()",body:"RGBA unifica la lectura del canal alpha. El histograma resume 256 niveles y getbbox encuentra el rect\xE1ngulo visible. Ninguna transformaci\xF3n se guarda sobre el original.",input:"P\xEDxeles decodificados",output:"Dimensiones + histograma + caja",example:"Lienzo 800 \xD7 600 \u2192 caja visible 500 \xD7 300."},{title:"Evaluar las reglas",file:"evaluacion.py",symbol:"evaluar_imagen",code:"ppi = max(ancho, alto) * 2.54 / lado_cm",body:"Inicial usa el lienzo completo; final usa el rect\xE1ngulo visible. Se conservan proporciones y se agregan todos los avisos aplicables. No se mide nitidez.",input:"Imagen + par\xE1metros",output:"Diccionario por archivo",example:"500 px / 4 cm \u2192 317,5 PPI."},{title:"Resumir y exportar",file:"informes.py",symbol:"guardar_informes",code:"resumir_resultados() \u2192 guardar_informes() \u2192 crear_galeria()",body:"Las estad\xEDsticas distinguen le\xEDdos y rechazados. CSV y HTML reciben los resultados en memoria. El HTML a\xF1ade miniaturas y controles locales.",input:"Resultados + errores",output:"CSV + HTML + miniaturas",example:"2 para revisar / 12 le\xEDdas = 16,67 %."},{title:"Decidir y continuar",file:"seleccion.py",symbol:"preparar_photoroom",code:"opci\xF3n 3: copiar \xB7 opci\xF3n 4: reanalizar",body:"La persona selecciona im\xE1genes y descarga el JSON. Puede copiar los originales para usar PhotoRoom manualmente o volver a analizarlos con otros par\xE1metros.",input:"Selecci\xF3n humana",output:"Copias / nuevo informe",example:"Seleccionar no significa aprobar ni haber quitado el fondo."}],SC=[{title:"Problema y alcance",page:1,status:"Evidencia en el proyecto",evidence:"README: necesidad del microemprendimiento, usuario, pregunta y l\xEDmites.",say:"Identifico im\xE1genes que requieren revisi\xF3n t\xE9cnica po es. Equivalencia de fuentes en ambas etapas y conservaci\xF3n de originales.",say:"500 px a 4 cm deben dar 317,5 PPI. Una copia borrosa con igual dimensi\xF3n da el mismo PPI: esa prueba demuestra un l\xEDmite.",show:"test_fuentes.py",pending:"Resultado observado el 22/10/2026. Los tests HTML no sustituyen una inspecci\xF3n visual ni prueban impresi\xF3n f\xEDsica."},{title:"Git y GitHub",page:3,status:"Historial disponible",evidence:"Remoto configurado y commits locales reales; .gitignore excluye salidas, muestras y entornos.",say:"Cada commit debe representar un cambio concreto. El hash identifica la versi\xF3n que entrego.",show:".gitignore",pending:"Revisar git status y git diff, tener al menos cinco commits significativos y comprobar publicaci\xF3n y acceso docente. Esta gu\xEDa no hizo commit ni push."},{title:"Documentar y defender",page:3,status:"Preparaci\xF3n de entrega",evidence:"README, diccionario, tests e informe; comandos, ejemplo y limitaciones. Esta gu\xEDa ayuda a estudiar y ensayar.",say:"Puedo seguir un archivo desde la entrada hasta el informe y explicar una decisi\xF3n, una prueba y una limitaci\xF3n.",show:"README.md",pending:"Entregar enlace y commit o etiqueta, realizar demo breve y defensa individual. Recuperaci\xF3n de TP1 solo si corresponde. No hay nota ni ponderaciones inventadas."}],yr=[["\xBFQu\xE9 problema resuelve y qu\xE9 no resuelve?","Prioriza archivos para revisi\xF3n t\xE9cnica seg\xFAn tama\xF1o y transparencia. No detecta nitidez, no quita fondos, no certifica impresi\xF3n ni administra ventas.","Problema y alcance"],["\xBFPor qu\xE9 una clase ImagenSticker?","Cada archivo v\xE1lido tiene ruta, formato, dimensiones, histograma alpha y caja visible. Sus m\xE9todos calculan dimensiones visibles y porcentajes a partir de ese estado.","Clases"],["\xBFD\xF3nde hay abstracci\xF3n y polimorfismo?","FuenteImagenes exige cargar(). FuenteCarpeta y FuenteSeleccionJSON lo implementan; analizar_fuente llama cargar() sin comprobar el tipo concreto.","Dise\xF1o"],["\xBFPor qu\xE9 no alcanza una regex para validar una imagen?","La regex reconoce extensiones; un archivo puede llamarse .png y contener otros bytes. Pillow comprueba formato real, integridad y decodificaci\xF3n.","Validaci\xF3n"],["\xBFCu\xE1l es la diferencia entre revisi\xF3n inicial y final?","Inicial admite PNG/JPEG y usa el lienzo completo. Final admite PNG y calcula sobre la caja visible; eval\xFAa opacidad y semitransparencia. Ambas requieren revisi\xF3n visual.","Etapas"],["500 p\xEDxeles a 4 cm: \xBFqu\xE9 resoluci\xF3n obtengo? \xBFY a 8 cm?","500 \xD7 2,54 / 4 = 317,5 PPI; a 8 cm son 158,75. Duplicar el tama\xF1o f\xEDsico reduce a la mitad la resoluci\xF3n, sin crear o quitar p\xEDxeles.","C\xE1lculo"],["\xBFPPI alto significa imagen n\xEDtida?","No. Una captura borrosa ampliada puede tener muchos p\xEDxeles. PPI relaciona dimensiones con tama\xF1o f\xEDsico; no mide detalle ni es el DPI mec\xE1nico de la impresora.","L\xEDmites"],["\xBFC\xF3mo se calculan los porcentajes de alpha?","Transparentes: alpha 0 / total de p\xEDxeles. Parciales: alpha 1\u2026254 / visibles. Visibles excluye alpha 0. En imagen vac\xEDa el parcial es 0 por convenci\xF3n, con advertencia.","Denominadores"],["\xBFQu\xE9 pasa exactamente al llegar a 20 % parcial?","Con umbral 20 no hay aviso porque la comparaci\xF3n es >, no >=. Puede haber otros avisos, por ejemplo resoluci\xF3n baja.","L\xEDmites"],["\xBFQu\xE9 ocurre si hay un PDF o una imagen da\xF1ada?","Queda como ERROR_LECTURA en CSV y No procesado en HTML, con motivo y medidas vac\xEDas. El lote sigue; la salida es 1 si hubo alg\xFAn rechazo.","Errores"],["\xBFQu\xE9 significa que 2 de 13 archivos requieran revisar?","Si uno no se pudo leer, el denominador es 12: 2/12 = 16,67 %. No se divide por 13 y no es una tasa de calidad comercial.","Estad\xEDstica"],["\xBFEl CSV se usa para construir el HTML?","No. Ambos reciben los resultados en memoria. Conservar el HTML porque el CSV no incluye umbral parcial ni la opci\xF3n de opacidad.","Salidas"],["\xBFQu\xE9 guarda el JSON de selecci\xF3n?","Versi\xF3n 1, carpeta absoluta y nombres. No contiene im\xE1genes, PPI, fecha, aprobaci\xF3n ni garant\xEDa de copia. Opci\xF3n 3 copia; opci\xF3n 4 reanaliza.","Selecci\xF3n"],["\xBFSe eliminan duplicados?","No se detectan archivos de igual contenido. Solo se quitan nombres repetidos en una selecci\xF3n JSON, conservando su orden con dict.fromkeys.","Datos"],["\xBFQu\xE9 prueba demuestra que ambas fuentes son intercambiables?","test_equivalencia_de_ambas_fuentes_en_ambas_etapas compara resultados y errores ordenados de carpeta y JSON con los mismos originales.","Tests"],["\xBFQu\xE9 significan los c\xF3digos 0, 1, 2 y 130?","0: sin rechazos, aunque haya avisos. 1: alg\xFAn archivo rechazado/no copiado. 2: error global de par\xE1metros, fuente o escritura. 130: cancelaci\xF3n.","CLI"],["\xBFQu\xE9 pendiente acad\xE9mico no oculta esta interfaz?","Acreditar datos compartibles y 50 observaciones o justificaci\xF3n menor, justificar la adaptaci\xF3n de fuentes y confirmar publicaci\xF3n/acceso de la versi\xF3n entregada.","Entrega"],["\xBFPor qu\xE9 guardar None y no cero cuando no hay PPI?","Cero ser\xEDa una medici\xF3n num\xE9rica; None indica que no corresponde o no pudo calcularse. El CSV lo deja vac\xEDo. Sin im\xE1genes le\xEDdas, el porcentaje global no aplica.","Faltantes"],["\xBFQu\xE9 costo tiene el procesamiento?","Ordenar n nombres cuesta O(n log n). Lectura, alpha y miniaturas dependen de la cantidad de p\xEDxeles. Se conservan mediciones, no todos los bitmaps abiertos. No hay benchmark del lote completo.","Complejidad"],["\xBFQu\xE9 pasa si cambia el original luego del informe?","La copia y el rean\xE1lisis usan el archivo actual. El JSON no guarda una huella del original; hay que regenerar el informe tras modificarlo.","Trazabilidad"]],ui=[["El problema","Recibimos im\xE1genes, no garant\xEDas de impresi\xF3n.","El usuario necesita identificar qu\xE9 archivos requieren revisi\xF3n por resoluci\xF3n y transparencia al tama\xF1o previsto. El resultado orienta una decisi\xF3n manual.","Mostr\xE1 el README y delimit\xE1 nitidez, fondos y ventas fuera del alcance."],["Los datos","Un archivo, una observaci\xF3n en una ejecuci\xF3n.","PNG/JPEG del emprendimiento. Variables relevantes: dimensiones, resoluci\xF3n efectiva, porcentajes alpha y estado. Un rean\xE1lisis no representa una venta nueva.","Explic\xE1 procedencia, restricciones y c\xF3mo acceder\xE1 la c\xE1tedra a una muestra autorizada."],["El recorrido","De rutas a decisiones explicables.","Fuente \u2192 lectura y validaci\xF3n \u2192 transformaci\xF3n en memoria \u2192 evaluaci\xF3n \u2192 resumen y reportes. Cada m\xF3dulo tiene una responsabilidad.","Us\xE1 el recorrido animado y se\xF1al\xE1 d\xF3nde se separan los errores."],["El dise\xF1o","Dos fuentes, un mismo contrato.","FuenteImagenes.cargar() devuelve rutas. Carpeta y selecci\xF3n JSON son intercambiables. ImagenSticker representa una imagen con estado y m\xE9todos.","Abr\xED fuentes.py y analizar_fuente(). Justific\xE1 la adaptaci\xF3n frente a la consigna."],["La cuenta","500 px a 4 cm = 317,5 PPI.","A 8 cm baja a 158,75. Inicial mide el lienzo; final mide la caja visible. Los porcentajes alpha usan denominadores distintos.","Mov\xE9 el tama\xF1o en el laboratorio. Record\xE1: PPI alto no prueba nitidez."],["La demostraci\xF3n","Un candidato, una advertencia y un rechazo.","Ejecut\xE1 una muestra autorizada inicial con PNG/JPEG/PDF, abr\xED el HTML, filtr\xE1 y descarg\xE1 selecci\xF3n. Opci\xF3n 3 copia; opci\xF3n 4 reanaliza.","La interfaz de estudio no ejecuta el programa: realiz\xE1 esta demo desde la terminal del TP."],["La verificaci\xF3n","Una propiedad vale m\xE1s que un \xABfunciona\xBB.","Mostr\xE1 el caso de PPI conocido y equivalencia de fuentes. 52 tests pasaron el 22/10/2026; eso no garantiza todos los formatos ni la impresi\xF3n f\xEDsica.","Mostr\xE1 el comando de unittest y explic\xE1 entrada, esperado y aserci\xF3n."],["El cierre","Decisiones, l\xEDmites y versi\xF3n entregada.","Separ\xE1 evidencia t\xE9cnica de pendientes acad\xE9micos. Identific\xE1 el commit, el acceso a datos y la adaptaci\xF3n de fuentes. La revisi\xF3n humana sigue siendo necesaria.","No leas todo: respond\xE9 con una afirmaci\xF3n, evidencia del c\xF3digo y una limitaci\xF3n."]],EC=[["Path","Objeto de pathlib que representa una ruta; / une segmentos sin concatenar separadores manualmente."],["self","Referencia a la instancia: permite que cada ImagenSticker conserve sus propias medidas."],["ABC / abstractmethod","Clase base abstracta y m\xE9todo obligatorio que las subclases deben implementar."],["Polimorfismo","Usar el mismo cargar() con fuentes distintas sin cambiar el analizador."],["Histograma alpha","Lista de 256 conteos: cada posici\xF3n indica cu\xE1ntos p\xEDxeles tienen ese nivel de alpha."],["Caja visible","Rect\xE1ngulo que abarca todos los p\xEDxeles con alpha > 0, incluidos p\xEDxeles aislados."],["RGBA","Canales rojo, verde, azul y alpha. La conversi\xF3n normaliza el an\xE1lisis en memoria."],["EXIF","Metadatos que pueden indicar orientaci\xF3n. exif_transpose los aplica antes de medir."],["with","Administrador de contexto que cierra archivos y recursos incluso ante errores."],["try / except","Separa el camino normal de errores esperados y permite informar fallos comprensibles."],["None","Ausencia o dato no aplicable; no es lo mismo que el n\xFAmero cero."],["Comprensi\xF3n de listas","Construye una lista aplicando una expresi\xF3n por elemento; main eval\xFAa as\xED las im\xE1genes v\xE1lidas."],["Diccionario","Asocia claves con valores: resultados, configuraci\xF3n, conteos por motivo y estructura JSON."],["Regex","Patr\xF3n textual que valida extensiones o nombres de descargas; no inspecciona p\xEDxeles."],["Heur\xEDstica","Regla pr\xE1ctica configurable, como el umbral de semitransparencia; no es una garant\xEDa universal."],["BOM","Marca UTF-8 al inicio del el proceso; no certifica nitidez."""
import math


LADO_MIN_CM = 0.1
LADO_MAX_CM = 56


def validar_lado(lado_cm):
    if not math.isfinite(lado_cm) or not LADO_MIN_CM <= lado_cm <= LADO_MAX_CM:
        raise ValueError(f"El lado mayor debe estar entre {LADO_MIN_CM:g} y {LADO_MAX_CM:g} cm, inclusive.")


def validar_parametros(lado_cm, ppi_minimos, umbral_parcial):
    validar_lado(lado_cm)
    if not math.isfinite(ppi_minimos) or ppi_minimos <= 0:
        raise ValueError("La referencia PPI debe ser positiva y finita.")
    if not math.isfinite(umbral_parcial) or not 0 <= umbral_parcial <= 100:
        raise ValueError("El umbral de transparencia parcial debe estar entre 0 y 100.")


def evaluar_imagen(imagen, lado_cm=4, ppi_minimos=300,
                   umbral_parcial=20, exigir_transparencia=True, etapa="final"):
    validar_parametros(lado_cm, ppi_minimos, umbral_parcial)
    if etapa not in ("inicial", "final"):
        raise ValueError("La etapa debe ser inicial o final.")
    ancho_visible, alto_visible = imagen.dimensiones_visibles()
    if etapa == "inicial":
        ancho, alto = imagen.ancho_px, imagen.alto_px
        transparentes, parciales = None, None
        tipo = "no_evaluada"
        base = "imagen_completa"
        observacion = ("Nitidez no evaluada. Capturas ampliadas, m\xE1rgenes y varios dise\xF1os "
                       "pueden sobreestimar la resoluci\xF3n \xFAtil del sticker.")
    else:
        ancho, alto = ancho_visible, alto_visible
        transparentes, parciales = imagen.porcentajes_alpha()
        tipo = "con_transparencia"
        base = "rectangulo_visible"
        observacion = "Sin advertencias no garantiza calidad ni aprobaci\xF3n para imprimir."
    advertencias = []
    ppi = ancho_cm = alto_cm = None
    if not ancho_visible or not alto_visible:
        tipo = "completamente_transparente"
        advertencias.append("SIN_CONTENIDO_VISIBLE")
    else:
        ppi = max(ancho, alto) * 2.54 / lado_cm
        ancho_cm = lado_cm * ancho / max(ancho, alto)
        alto_cm = lado_cm * alto / max(ancho, alto)
        if ppi < ppi_minimos:
            advertencias.append("RESOLUCION_INFERIOR_A_REFERENCIA")
        if etapa == "final":
            if imagen.formato != "PNG":
                advertencias.append("FORMATO_NO_PREPARADO")
            if imagen.histograma_alpha[255] == imagen.ancho_px * imagen.alto_px:
                tipo = "opaca"
                if exigir_transparencia:
                    advertencias.append("SIN_TRANSPARENCIA")
            if parciales > umbral_parcial:
                advertencias.append("ALTA_PROPORCION_SEMITRANSPARENTE")
    estado = "REVISAR" if advertencias else (
        "CANDIDATO" if etapa == "inicial" else "SIN_ADVERTENCIAS")
    return {
        "archivo": imagen.ruta.name, "formato": imagen.formato,
        "etapa": etapa, "base_resolucion": base,
        "ancho_px": imagen.ancho_px, "alto_px": imagen.alto_px,
        "ancho_visible_px": ancho_visible, "alto_visible_px": alto_visible,
        "ancho_evaluado_px": ancho, "alto_evaluado_px": alto,
        "lado_mayor_cm": lado_cm, "ancho_impresion_cm": ancho_cm,
        "alto_impresion_cm": alto_cm, "resolucion_ppi": ppi,
        "referencia_ppi": ppi_minimos, "tipo_transparencia": tipo,
        "transparentes_pct_lienzo": transparentes,
        "semitransparentes_pct_visibles": parciales,
        "estado": estado, "advertencias": advertencias,
        "observaciones": observacion, "error": "",
    }


def resumir_resultados(resultados, errores):
    leidos = len(resultados)
    revisar = sum(r["estado"] == "REVISAR" for r in resultados)
    candidatos = sum(r["estado"] == "CANDIDATO" for r in resultados)
    sin = sum(r["estado"] == "SIN_ADVERTENCIAS" for r in resultados)
    motivos = {}
    for resultado in resultados:
        for motivo in resultado["advertencias"]:
            motivos[motivo] = motivos.get(motivo, 0) + 1
    return {
        "encontrados": leidos + len(errores), "leidos": leidos,
        "errores": len(errores), "revisar": revisar,
        "sin_advertencias": sin, "candidatos": candidatos,
        "revisar_pct_leidos": 100 * revisar / leidos if leidos else None,
        "motivos": motivos,
    }

from abc import ABC, abstractmethod
from pathlib import Path
import json


class FuenteImagenes(ABC):
    """Contrato: cargar devuelve rutas, sin evaluar ni copiar im\xE1genes."""

    def __init__(self, ruta):
        self.ruta = Path(ruta)

    @abstractmethod
    def cargar(self):
        """Devuelve una lista de Path; una fuente inv\xE1lida produce una excepci\xF3n."""
        pass


class FuenteCarpeta(FuenteImagenes):
    def cargar(self):
        return buscar_archivos(self.ruta)


class FuenteSeleccionJSON(FuenteImagenes):
    def cargar(self):
        origen, nombres, _ = leer_seleccion(self.ruta)
        return [origen / nombre for nombre in dict.fromkeys(nombres)]


def buscar_archivos(carpeta):
    """Busca archivos del primer nivel y los ordena por nombre."""
    carpeta = Path(carpeta)
    if not carpeta.exists():
        raise FileNotFoundError(f"La carpeta no existe: {carpeta}")
    if not carpeta.is_dir():
        raise NotADirectoryError(f"La ruta no corresponde a una carpeta: {carpeta}")
    archivos = []
    for ruta in carpeta.iterdir():
        if ruta.is_file():
            archivos.append(ruta)
    return sorted(archivos, key=lambda ruta: (ruta.name.casefold(), ruta.name))


def leer_seleccion(archivo_seleccion):
    """Valida el JSON compartido por rean\xE1lisis y copia para PhotoRoom."""
    try:
        contenido = Path(archivo_seleccion).read_bytes()
        datos = json.loads(contenido.decode("utf-8-sig"))
    except (UnicodeError, json.JSONDecodeError) as error:
        raise ValueError("La selecci\xF3n no es un JSON v\xE1lido descargado del informe.") from error
    if not isinstance(datos, dict) or datos.get("version") != 1:
        raise ValueError("Formato de selecci\xF3n no reconocido.")
    carpeta = datos.get("carpeta")
    nombres = datos.get("archivos")
    if not isinstance(carpeta, str) or not Path(carpeta).is_absolute():
        raise ValueError("La selecci\xF3n debe indicar una carpeta de origen absoluta.")
    if not isinstance(nombres, list) or not nombres:
        raise ValueError("La selecci\xF3n no contiene archivos.")
    for nombre in nombres:
        if (not isinstance(nombre, str) or not nombre or
                any(c in nombre for c in '/\\\\:\\x00') or
                Path(nombre).suffix.lower() not in (".png", ".jpg", ".jpeg")):
            raise ValueError("La selecci\xF3n contiene un nombre de imagen inv\xE1lido.")
    origen = Path(carpeta).resolve()
    if not origen.is_dir():
        raise ValueError(f"La carpeta original ya no est\xE1 disponible: {origen}")
    return origen, nombres, contenido

                     if etapa == "inicial" else "El tama\xF1o corresponde al lado mayor del dise\xF1o visible."),

    print("2. Revisi\xF3n final: archivos preparados (PNG).")

    while True:
        valor = input(f"Etapa [{'1' if predeterminada == 'inicial' else '2'}]: ").strip().lower()

            return "inicial"

            return "final"

    print("Los originales no se modifican. Pod\xE9s cancelar con Ctrl+C.")
    etapa = pedir_etapa(etapa)
    if etapa == "seleccion":
        return {"seleccion": pedir_seleccion()}
    analizar_seleccion = None
    if etapa == "reanalizar":
        analizar_seleccion = pedir_seleccion()
        etapa = pedir_etapa(permitir_acciones=False)

    else:
        carpeta = pedir_carpeta()

          if etapa == "inicial" else
          "El tama\xF1o corresponde al rect\xE1ngulo visible, sin m\xE1rgenes transparentes.")

def carpeta_descargas():
    """Consulta Descargas de Windows; usa la ubicaci\xF3n habitual como respaldo."""
    if os.name == "nt":
        try:
            import winreg
            clave = r"Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\User Shell Folders"
            with winreg.OpenKey(winreg.HKEY_CURRENT_USER, clave) as registro:
                valor, _ = winreg.QueryValueEx(registro, "{374DE290-123F-4565-9164-39C4925E467B}")
            return Path(os.path.expandvars(valor))
        except OSError:
            pass
    return Path.home() / "Downloads"


def buscar_selecciones(carpeta):
    """Reconoce el nombre de descarga y sus copias numeradas por el navegador."""
    encontrados = []
    for ruta in Path(carpeta).iterdir():
        if re.fullmatch(r"seleccion_photoroom(?: \\(\\d+\\))?\\.json", ruta.name, re.IGNORECASE):
            try:
                if ruta.is_file():
                    encontrados.append((ruta, ruta.stat().st_mtime))
            except OSError:
                continue
    return sorted(encontrados, key=lambda item: (-item[1], item[0].name.casefold()))


def pedir_seleccion():
    carpeta = carpeta_descargas()
    print(f"Buscando selecciones en: {carpeta}")
    try:
        encontrados = buscar_selecciones(carpeta)
    except OSError:
        encontrados = []
        print("No se pudo acceder a Descargas. Pod\xE9s pegar la ruta del JSON.")
    for numero, (ruta, fecha) in enumerate(encontrados, start=1):
        momento = datetime.fromtimestamp(fecha).strftime("%d/%m/%Y %H:%M:%S")
        print(f"{numero}. {ruta.name} \u2014 guardado/modificado {momento}")
    if not encontrados:
        print("No se encontraron selecciones descargadas.")
    print("Eleg\xED un n\xFAmero o peg\xE1 la ruta de otro JSON. Ctrl+C cancela.")
    while True:
        texto = input("Selecci\xF3n: ").strip()
        if texto.isdecimal():
            numero = int(texto)
            if 1 <= numero <= len(encontrados):
                ruta = encontrados[numero - 1][0]
            else:
                print("Eleg\xED un n\xFAmero de la lista.")
                continue
        else:
            texto = texto.strip('"').strip("'")
            ruta = Path(texto).expanduser()
        if texto and ruta.is_file() and ruta.suffix.lower() == ".json":
            print(f"Selecci\xF3n elegida: {ruta}")
            return ruta
        print("Ingres\xE1 un n\xFAmero v\xE1lido o la ruta de un archivo JSON existente.")

import csv
from datetime import datetime
from pathlib import Path

CAMPOS = [
    "archivo", "formato", "etapa", "base_resolucion", "ancho_px", "alto_px",
    "ancho_visible_px", "alto_visible_px", "ancho_evaluado_px", "alto_evaluado_px",

]


def texto_resumen(resumen, lado_cm, ppi_minimos, umbral_parcial,
                  exigir_transparencia, carpeta, etapa="final"):
    porcentaje = resumen["revisar_pct_leidos"]
    porcentaje_texto = f"{porcentaje:.2f} %" if porcentaje is not None else "no aplica"
    lineas = [
        "AN\xC1LISIS T\xC9CNICO DE STICKERS",
        f"Etapa: {etapa}",
        f"Fuente de entrada (carpeta o JSON): {Path(carpeta).resolve()}",
        f"Lado mayor: {lado_cm:g} cm",
        f"Base del c\xE1lculo: {'imagen completa' if etapa == 'inicial' else 'rect\xE1ngulo visible'}",
        f"Referencia de resoluci\xF3n: {ppi_minimos:g} PPI",
    ]
    if etapa == "final":
        lineas += [f"Advertencia de semitransparencia: m\xE1s de {umbral_parcial:g} % de p\xEDxeles visibles",
                   f"Exigir transparencia: {'s\xED' if exigir_transparencia else 'no'}"]
    else:
        lineas += ["Transparencia y opacidad: no se eval\xFAan en la revisi\xF3n inicial.",
                   "La imagen completa puede incluir m\xE1rgenes, interfaz del celular y varios dise\xF1os."]
    lineas += [
        "", f"Archivos encontrados (sin subcarpetas): {resumen['encontrados']}",
        f"Le\xEDdos correctamente: {resumen['leidos']}",
        f"No procesados (formato no compatible o error de lectura): {resumen['errores']}",
        f"Con advertencias para revisar: {resumen['revisar']}",
    ]
    if etapa == "inicial":
        lineas.append(f"Candidatos a quitar fondo, sujetos a revisi\xF3n visual: {resumen['candidatos']}")
    else:
        lineas.append(f"Sin advertencias seg\xFAn estas reglas: {resumen['sin_advertencias']}")
    lineas += [f"Porcentaje para revisar entre los le\xEDdos: {porcentaje_texto}", "",
               "MOTIVOS (un archivo puede tener varios):"]
    lineas += [f"- {motivo}: {cantidad}" for motivo, cantidad in sorted(resumen["motivos"].items())]
    if not resumen["motivos"]:
        lineas.append("- Ninguno.")
    if resumen["encontrados"] == 0:
        lineas.append("No se encontraron archivos. No hay colecci\xF3n evaluada.")
    elif resumen["leidos"] == 0:
        lineas.append("No se pudo evaluar ninguna imagen: consultar errores.")
    lineas += ["", "INTERPRETACI\xD3N Y L\xCDMITES",
               "Nitidez no evaluada: una captura borrosa puede tener muchos p\xEDxeles y superar la referencia.",
               "CANDIDATO significa que cumple la referencia num\xE9rica; no autoriza procesamiento autom\xE1tico.",
               "Si hay m\xE1rgenes o varios stickers, seleccionar el dise\xF1o y volver a evaluar es m\xE1s representativo.",
               "El programa no recorta, convierte ni elimina fondos en los originales.",
               "Convertir JPEG a PNG no recupera detalles ni elimina el fondo.",
               "SIN_ADVERTENCIAS no garantiza calidad para imprimir.",
               "La semitransparencia puede ser intencional; su umbral final es una heur\xEDstica configurable.",
               "En modo final se aceptan PNG; los JPEG se registran como ERROR_LECTURA con explicaci\xF3n.",
               "Los valores vac\xEDos del CSV indican mediciones no aplicables o no disponibles.",
               "Consultar informe.csv e informe.html para identificar cada archivo."]
    return "\\n".join(lineas) + "\\n"


def guardar_informes(resultados, errores, directorio):
    destino = Path(directorio) / datetime.now().strftime("analisis_%Y%m%d_%H%M%S_%f")
    destino.mkdir(parents=True, exist_ok=False)
    with (destino / "informe.csv").open("w", encoding="utf-8-sig", newline="") as archivo:
        escritor = csv.DictWriter(archivo, fieldnames=CAMPOS, delimiter=";")
        escritor.writeheader()
        for resultado in resultados:
            fila = dict(resultado)
            fila["advertencias"] = " | ".join(fila["advertencias"])
            for campo, valor in fila.items():
                if isinstance(valor, float):
                    fila[campo] = round(valor, 4)
            escritor.writerow(fila)
        for ruta, motivo in errores:
            escritor.writerow({"archivo": ruta.name, "estado": "ERROR_LECTURA", "error": motivo})
    return destino.resolve()

from pathlib import Path
import re
import warnings

from PIL import Image, ImageOps, UnidentifiedImageError

if __package__:
    from .fuentes import FuenteCarpeta, buscar_archivos
else:
    from fuentes import FuenteCarpeta, buscar_archivos



class ImagenSticker:
    """Dimensiones del lienzo de un sticker le\xEDdo correctamente."""

    def __init__(self, ruta, ancho_px, alto_px, histograma_alpha, caja_visible, formato="PNG"):
        self.formato = formato
        self.ruta = Path(ruta)
        self.ancho_px = ancho_px
        self.alto_px = alto_px
        self.histograma_alpha = histograma_alpha
        self.caja_visible = caja_visible

    def dimensiones_visibles(self):
        """Rect\xE1ngulo que contiene todos los p\xEDxeles con alpha mayor que cero."""
        if self.caja_visible is None:
            return 0, 0
        izquierda, arriba, derecha, abajo = self.caja_visible
        return derecha - izquierda, abajo - arriba

    def porcentajes_alpha(self):
        """Transparencia total sobre el lienzo y parcial sobre p\xEDxeles visibles."""
        total = self.ancho_px * self.alto_px
        transparentes = self.histograma_alpha[0]
        parciales = sum(self.histograma_alpha[1:255])
        visibles = total - transparentes
        return (100 * transparentes / total,
                100 * parciales / visibles if visibles else 0)

def leer_imagen(ruta):
    """Comprueba formato e integridad y obtiene dimensiones en p\xEDxeles."""
    ruta = Path(ruta)
    try:
        with warnings.catch_warnings():
            warnings.simplefilter("error", Image.DecompressionBombWarning)
            with Image.open(ruta) as imagen:
                esperado = "PNG" if ruta.suffix.lower() == ".png" else "JPEG"
                formato = imagen.format
                if formato != esperado:
                    raise ValueError(f"El contenido no es {esperado}, aunque tenga esa extensi\xF3n.")
                if getattr(imagen, "n_frames", 1) > 1:
                    raise ValueError("Los PNG animados no se admiten en esta versi\xF3n.")
                imagen.verify()
            # verify() requiere reabrir para decodificar los p\xEDxeles.
            with Image.open(ruta) as imagen:
                imagen.load()
                imagen = ImageOps.exif_transpose(imagen)
                ancho, alto = imagen.size
                # RGBA tambi\xE9n interpreta transparencia de paleta y PNG RGB con tRNS.
                # Esta conversi\xF3n ocurre en memoria y nunca se guarda sobre el original.
                with imagen.convert("RGBA") as rgba:
                    with rgba.getchannel("A") as alpha:
                        histograma = alpha.histogram()
                        caja = alpha.getbbox()
                return ImagenSticker(ruta, ancho, alto, histograma, caja, formato)
    except UnidentifiedImageError as error:
        raise ValueError("Imagen no reconocida; puede estar da\xF1ada o vac\xEDa.") from error
    except (Image.DecompressionBombWarning, Image.DecompressionBombError) as error:
        raise ValueError("La imagen supera el l\xEDmite de seguridad de Pillow.") from error
    except (OSError, SyntaxError) as error:
        raise ValueError(f"No se pudo leer el archivo: {error}") from error


def analizar_carpeta(carpeta, etapa="final"):
    """Atajo compatible con el an\xE1lisis original por carpeta."""
    return analizar_fuente(FuenteCarpeta(carpeta), etapa)


def analizar_fuente(fuente, etapa="final"):
    """Separa im\xE1genes v\xE1lidas y errores sin detener todo el lote."""
    if etapa not in ("inicial", "final"):
        raise ValueError("La etapa debe ser inicial o final.")
    imagenes = []
    errores = []
    for ruta in fuente.cargar():
        try:
            if not re.search(r"\\.(png|jpe?g)\\Z", ruta.name, re.IGNORECASE):
                extension = ruta.suffix or "sin extensi\xF3n"
                admitidos = "PNG, JPG y JPEG" if etapa == "inicial" else "PNG"
                raise ValueError(f"Formato no compatible ({extension}). "
                                 f"La revisi\xF3n {etapa} admite {admitidos}. No se abri\xF3 el archivo.")
            if etapa == "final" and ruta.suffix.lower() != ".png":
                raise ValueError("La revisi\xF3n final requiere PNG. Para JPEG us\xE1 la etapa inicial.")
            imagenes.append(leer_imagen(ruta))
        except ValueError as error:
            errores.append((ruta, str(error)))
    return imagenes, errores

import argparse
import sys

from seleccion import mostrar_preparacion
from lectura import analizar_fuente
from fuentes import FuenteCarpeta, FuenteSeleccionJSON
from guiado import configurar_guiado, abrir_informe
from galeria import crear_galeria
from evaluacion import evaluar_imagen, resumir_resultados, validar_parametros
from informes import guardar_informes, texto_resumen


def main():
    parser = argparse.ArgumentParser(description="Eval\xFAa resoluci\xF3n y transparencia de stickers PNG/JPEG.")
    parser.add_argument("carpeta", nargs="?", type=Path,
                        help="Carpeta de PNG/JPEG; si se omite, inicia el modo guiado")
    parser.add_argument("--lado-cm", type=float, default=4,
                        help="Lado mayor en cm: de 0.1 a 56 (predeterminado: 4); imagen completa en inicial, contenido visible en final")
    parser.add_argument("--ppi", type=float, default=300,
                        help="Referencia m\xEDnima de p\xEDxeles por pulgada (300)")
    parser.add_argument("--umbral-parcial", type=float, default=20,
                        help="Porcentaje de p\xEDxeles visibles semitransparentes que activa aviso (20)")
    parser.add_argument("--permitir-opacas", action="store_true",
                        help="No advertir por ausencia de transparencia")
    parser.add_argument("--salida", type=Path,
                        default=Path(__file__).resolve().parents[1] / "outputs",
                        help="Carpeta para los informes (predeterminado: outputs en la ra\xEDz del proyecto)")
    parser.add_argument("--etapa", choices=("inicial", "final"),
                        help="Inicial: recibidos PNG/JPEG; final: PNG preparados")
    parser.add_argument("--seleccion", type=Path, help="JSON descargado del HTML para copiar originales a PhotoRoom")
    parser.add_argument("--analizar-seleccion", type=Path, help="JSON de selecci\xF3n para reanalizar los originales sin copiarlos")
    argumentos = parser.parse_args()
    if sum(valor is not None for valor in (argumentos.seleccion, argumentos.carpeta, argumentos.analizar_seleccion)) > 1:
        parser.error("Eleg\xED solo una entrada: carpeta, --analizar-seleccion o --seleccion.")
    abrir_al_terminar = False
    try:
        if argumentos.seleccion is not None:
            return mostrar_preparacion(argumentos.seleccion, argumentos.salida)
        validar_parametros(argumentos.lado_cm, argumentos.ppi, argumentos.umbral_parcial)
        if argumentos.carpeta is None and argumentos.analizar_seleccion is None:
            config = configurar_guiado(
                argumentos.lado_cm, argumentos.ppi, argumentos.umbral_parcial,
                not argumentos.permitir_opacas, argumentos.etapa or "inicial")
            if "seleccion" in config:
                return mostrar_preparacion(config["seleccion"], argumentos.salida)
            abrir_al_terminar = config.pop("abrir")
            for clave, valor in config.items():
                setattr(argumentos, clave, valor)
        argumentos.etapa = argumentos.etapa or ("inicial" if argumentos.analizar_seleccion else "final")
        validar_parametros(argumentos.lado_cm, argumentos.ppi, argumentos.umbral_parcial)
        fuente = (FuenteSeleccionJSON(argumentos.analizar_seleccion) if argumentos.analizar_seleccion
                  else FuenteCarpeta(argumentos.carpeta))
        print(f"Analizando fuente: {fuente.ruta.resolve()}")
        imagenes, errores = analizar_fuente(fuente, argumentos.etapa)
        resultados = [
            evaluar_imagen(imagen, argumentos.lado_cm, argumentos.ppi,
                           argumentos.umbral_parcial, not argumentos.permitir_opacas, argumentos.etapa)
            for imagen in imagenes
        ]
        resumen = resumir_resultados(resultados, errores)
        texto = texto_resumen(resumen, argumentos.lado_cm, argumentos.ppi,
                              argumentos.umbral_parcial, not argumentos.permitir_opacas,

from datetime import datetime
from pathlib import Path
import shutil

if __package__:
    from .fuentes import leer_seleccion
else:
    from fuentes import leer_seleccion


def preparar_photoroom(archivo_seleccion, directorio):
    """Devuelve destino, nombres copiados y errores; nunca mueve los originales."""
    origen, nombres, contenido = leer_seleccion(archivo_seleccion)
    destino = Path(directorio).resolve() / datetime.now().strftime("seleccion_photoroom_%Y%m%d_%H%M%S_%f")
    destino.mkdir(parents=True, exist_ok=False)
    # Conserva exactamente la selecci\xF3n recibida, incluso si falta alg\xFAn original.
    (destino / "seleccion_photoroom.json").write_bytes(contenido)
    copiados, errores = [], []
    # Conserva el orden y evita copiar dos veces el mismo nombre.
    for nombre in dict.fromkeys(nombres):
        fuente = origen / nombre
        try:
            if fuente.is_symlink() or fuente.resolve().parent != origen:
                raise ValueError("El archivo apunta fuera de la carpeta original.")
            if not fuente.is_file():
                raise ValueError("El original no existe o fue movido.")
            # Modo exclusivo: tampoco se sobrescriben colisiones de nombres.
            with fuente.open("rb") as entrada, (destino / nombre).open("xb") as salida:
                try:
                    shutil.copyfileobj(entrada, salida)
                except OSError:
                    salida.close()
                    (destino / nombre).unlink(missing_ok=True)
                    raise
            copiados.append(nombre)
        except (OSError, ValueError) as error:
            errores.append((nombre, str(error)))
    return destino, copiados, errores


def mostrar_preparacion(archivo_seleccion, directorio):
    destino, copiados, errores = preparar_photoroom(archivo_seleccion, directorio)
    print(f"Originales copiados: {len(copiados)}")
    for nombre, error in errores:
        print(f"NO COPIADO | {nombre} | {error}")
    print(f"Carpeta para PhotoRoom: {destino}")
    print(f"Selecci\xF3n guardada: {destino / 'seleccion_photoroom.json'}")
    print("No se convierten formatos ni se eliminan fondos. Los originales permanecen intactos.")
    return 1 if errores else 0

class PruebasEvaluacion(unittest.TestCase):
    def setUp(self):
        temporal = tempfile.TemporaryDirectory()
        self.addCleanup(temporal.cleanup)
        self.carpeta = Path(temporal.name)

    def crear(self, modo="RGBA", medida=(500, 500), color=(255, 0, 0, 255)):
        ruta = self.carpeta / "ejemplo.png"
        with Image.new(modo, medida, color) as imagen:
            imagen.save(ruta)
        return leer_imagen(ruta)

    def test_resolucion_y_doble_tamano(self):
        imagen = self.crear()
        a = evaluar_imagen(imagen, 4, exigir_transparencia=False)
        b = evaluar_imagen(imagen, 8, exigir_transparencia=False)
        self.assertAlmostEqual(a["resolucion_ppi"], 317.5)
        self.assertEqual(b["resolucion_ppi"], a["resolucion_ppi"] / 2)
        self.assertEqual(a["estado"], "SIN_ADVERTENCIAS")
        self.assertIn("RESOLUCION_INFERIOR_A_REFERENCIA", b["advertencias"])

    def test_umbral_exacto_no_advierte(self):
        resultado = evaluar_imagen(self.crear(medida=(300, 150)), 2.54,
                                  exigir_transparencia=False)
        self.assertEqual(resultado["resolucion_ppi"], 300)
        self.assertEqual(resultado["advertencias"], [])

    def test_margenes_y_proporciones(self):
        ruta = self.carpeta / "margenes.png"
        with Image.new("RGBA", (500, 500), (0, 0, 0, 0)) as imagen:
            imagen.paste((255, 0, 0, 255), (100, 150, 400, 350))
            imagen.save(ruta)
        resultado = evaluar_imagen(leer_imagen(ruta), 4)
        self.assertEqual(resultado["ancho_visible_px"], 300)
        self.assertEqual(resultado["alto_visible_px"], 200)
        self.assertAlmostEqual(resultado["resolucion_ppi"], 190.5)
        self.assertEqual(resultado["ancho_impresion_cm"], 4)
        self.assertAlmostEqual(resultado["alto_impresion_cm"], 8 / 3)
        self.assertAlmostEqual(resultado["transparentes_pct_lienzo"], 76)

    def test_opaca_rgb_y_opcion(self):
        imagen = self.crear("RGB", color=(255, 0, 0))
        self.assertIn("SIN_TRANSPARENCIA", evaluar_imagen(imagen)["advertencias"])
        self.assertEqual(evaluar_imagen(imagen, exigir_transparencia=False)["advertencias"], [])

    def test_imagen_vacia_no_inventa_resolucion(self):
        resultado = evaluar_imagen(self.crear(color=(0, 0, 0, 0)))
        self.assertIsNone(resultado["resolucion_ppi"])
        self.assertEqual(resultado["advertencias"], ["SIN_CONTENIDO_VISIBLE"])
        self.assertEqual(resultado["transparentes_pct_lienzo"], 100)

    def test_parcial_sobre_visibles(self):
        ruta = self.carpeta / "parcial.png"
        with Image.new("RGBA", (10, 10), (0, 0, 0, 0)) as imagen:
            imagen.paste((255, 0, 0, 128), (0, 0, 5, 10))
            imagen.save(ruta)
        resultado = evaluar_imagen(leer_imagen(ruta))
        self.assertEqual(resultado["transparentes_pct_lienzo"], 50)
        self.assertEqual(resultado["semitransparentes_pct_visibles"], 100)
        self.assertIn("ALTA_PROPORCION_SEMITRANSPARENTE", resultado["advertencias"])

    def test_transparencia_de_paleta(self):
        ruta = self.carpeta / "paleta.png"
        with Image.new("P", (10, 10), 0) as imagen:
            imagen.putpalette([0, 0, 0, 255, 0, 0] + [0] * 762)
            imagen.putpixel((3, 4), 1)
            imagen.save(ruta, transparency=0)
        sticker = leer_imagen(ruta)
        self.assertEqual(sticker.dimensiones_visibles(), (1, 1))
        self.assertEqual(sticker.histograma_alpha[0], 99)

    def test_parametros_invalidos(self):
        for lado, ppi, parcial in [(0, 300, 20), (-1, 300, 20),
                                   (float("nan"), 300, 20), (4, float("inf"), 20),
                                   (4, 0, 20), (4, 300, 101), (4, 300, -1)]:
            with self.subTest(valores=(lado, ppi, parcial)):
                with self.assertRaises(ValueError):
                    validar_parametros(lado, ppi, parcial)

    def test_resumen_y_exportacion_incluyen_errores(self):
        resultados = [evaluar_imagen(self.crear())]
        errores = [(self.carpeta / "roto.png", "Archivo da\xF1ado")]
        resumen = resumir_resultados(resultados, errores)
        self.assertEqual(resumen["encontrados"], 2)
        self.assertEqual(resumen["leidos"],
                         resumen["revisar"] + resumen["sin_advertencias"])
        salida = guardar_informes(resultados, errores, self.carpeta / "salidas")
        with (salida / "informe.csv").open(encoding="utf-8-sig", newline="") as archivo:
            filas = list(csv.DictReader(archivo, delimiter=";"))
        self.assertEqual(len(filas), 2)
        self.assertEqual(filas[0]["estado"], "REVISAR")
        self.assertEqual(filas[1]["estado"], "ERROR_LECTURA")
        self.assertEqual(filas[1]["resolucion_ppi"], "")
        self.assertFalse((salida / "resumen.txt").exists())
        otra = guardar_informes(resultados, errores, self.carpeta / "salidas")
        self.assertNotEqual(salida, otra)

    def test_sin_imagenes_no_porcentaje_enganoso(self):
        resumen = resumir_resultados([], [])
        self.assertIsNone(resumen["revisar_pct_leidos"])
        self.assertIn("No se encontraron archivos",
                      texto_resumen(resumen, 4, 300, 20, True, self.carpeta))

    def test_cli_crea_reportes_y_rechaza_parametros(self):
        self.crear()
        base = [sys.executable, "src/main.py", str(self.carpeta),
                "--salida", str(self.carpeta / "salidas")]
        proyecto = Path(__file__).resolve().parents[1]
        correcto = subprocess.run(base, cwd=proyecto, capture_output=True, text=True)
        self.assertEqual(correcto.returncode, 0, correcto.stderr)
        self.assertEqual(len(list((self.carpeta / "salidas").glob("*/informe.csv"))), 1)
        invalido = subprocess.run(base + ["--lado-cm", "nan"], cwd=proyecto,
                                  capture_output=True, text=True)
        self.assertEqual(invalido.returncode, 2)
        self.assertEqual(len(list((self.carpeta / "salidas").glob("*/informe.csv"))), 1)


if __name__ == "__main__":
    unittest.main()

class PruebasFuentes(unittest.TestCase):
    def setUp(self):
        temporal = tempfile.TemporaryDirectory()
        self.addCleanup(temporal.cleanup)
        self.raiz = Path(temporal.name)
        self.carpeta = self.raiz / 'imagenes'
        self.carpeta.mkdir()
        Image.new('RGB', (500, 500), 'red').save(self.carpeta / 'uno.jpg')
        Image.new('RGBA', (200, 200), (0, 0, 255, 128)).save(self.carpeta / 'dos.png')
        self.json = self.raiz / 'seleccion.json'
        self.guardar(['dos.png', 'uno.jpg'])

    def guardar(self, nombres):
        self.json.write_text(json.dumps({'version': 1, 'carpeta': str(self.carpeta),
                                         'archivos': nombres}), encoding='utf-8')

    def test_contrato_abstracto(self):
        with self.assertRaises(TypeError):
            FuenteImagenes(self.carpeta)

    def test_equivalencia_de_ambas_fuentes_en_ambas_etapas(self):
        for etapa in ('inicial', 'final'):
            salidas = []
            for fuente in (FuenteCarpeta(self.carpeta), FuenteSeleccionJSON(self.json)):
                imagenes, errores = analizar_fuente(fuente, etapa)
                resultados = sorted([evaluar_imagen(i, etapa=etapa) for i in imagenes], key=lambda r:r['archivo'])
                salidas.append((resultados, sorted((p.name, e) for p,e in errores)))
            self.assertEqual(salidas[0], salidas[1])

    def test_solo_seleccionados_sin_duplicar_y_faltantes_visibles(self):
        self.guardar(['uno.jpg', 'uno.jpg', 'movido.png'])
        imagenes, errores = analizar_fuente(FuenteSeleccionJSON(self.json), 'inicial')
        self.assertEqual([i.ruta.name for i in imagenes], ['uno.jpg'])
        self.assertEqual([p.name for p,e in errores], ['movido.png'])

    def test_json_invalido_se_rechaza(self):
        self.guardar(['../fuera.jpg'])
        with self.assertRaises(ValueError):
            FuenteSeleccionJSON(self.json).cargar()
        self.json.write_text('no es JSON')
        with self.assertRaises(ValueError):
            FuenteSeleccionJSON(self.json).cargar()

class PruebasLectura(unittest.TestCase):
    def setUp(self):
        temporal = tempfile.TemporaryDirectory()
        self.addCleanup(temporal.cleanup)
        self.carpeta = Path(temporal.name)

    def crear_png(self, nombre="sticker.png"):
        ruta = self.carpeta / nombre
        with Image.new("RGBA", (40, 25), (255, 0, 0, 255)) as imagen:
            imagen.save(ruta, format="PNG")

        ruta = self.crear_png()

        sticker = leer_imagen(ruta)
        self.assertEqual((sticker.ancho_px, sticker.alto_px), (40, 25))
        self.assertEqual(ruta.read_bytes(), original)

    def test_lote_mixto_continua_y_contabiliza_todos(self):

        (self.carpeta / "danado.png").write_bytes(b"no es una imagen")
        (self.carpeta / "notas.txt").write_text("ignorar", encoding="utf-8")
        imagenes, errores = analizar_carpeta(self.carpeta)
        self.assertEqual(len(imagenes), 1)

        self.assertEqual(len(buscar_archivos(self.carpeta)), 3)

        with self.assertRaisesRegex(ValueError, "contenido no es PNG"):
            leer_imagen(ruta)

        ruta = self.crear_png()

        self.assertEqual(imagenes, [])
        self.assertEqual(len(errores), 1)

    def test_carpeta_vacia(self):
        self.assertEqual(analizar_carpeta(self.carpeta), ([], []))

        with self.assertRaises(FileNotFoundError):
            analizar_carpeta(self.carpeta / "inexistente")

    def test_ruta_es_archivo(self):
        with self.assertRaises(NotADirectoryError):
            analizar_carpeta(self.crear_png())

        self.guardar([self.nombre, self.nombre])

                with self.assertRaises(ValueError):

Autor: Pedro Burgos. Trabajo Pr\xE1ctico 2 de Programaci\xF3n Orientada a Datos.

## Problema y alcance

El microemprendimiento recibe im\xE1genes que deben revisarse antes de preparar stickers.
El programa responde: **\xBFQu\xE9 archivos presentan advertencias de resoluci\xF3n o
transparencia al tama\xF1o previsto, y qu\xE9 problemas aparecen con m\xE1s frecuencia?**

Se analizan im\xE1genes locales, se generan mediciones y estad\xEDsticas, y se presenta
una galer\xEDa para tomar decisiones manuales. No se necesitan registros contables.
Seg\xFAn la aclaraci\xF3n docente comunicada por el alumno, se permiten im\xE1genes como
entrada; el CSV es una salida del an\xE1lisis, no un requisito artificial de entrada.

Hay dos etapas:

| Etapa | Archivos admitidos | Base del c\xE1lculo | Resultado sin advertencias |
|---|---|---|---|
| Inicial: recepci\xF3n | PNG, JPG, JPEG est\xE1ticos | Imagen completa, incluidos fondos y m\xE1rgenes | CANDIDATO, sujeto a revisi\xF3n visual |
| Final: archivos preparados | PNG est\xE1ticos | Rect\xE1ngulo que contiene los p\xEDxeles visibles | SIN_ADVERTENCIAS, no aprobaci\xF3n de impresi\xF3n |

El programa no detecta nitidez, no convierte im\xE1genes ni quita fondos. Convertir
JPEG a PNG no recupera detalle. Una captura ampliada puede superar la referencia
PPI y seguir borrosa. La elecci\xF3n para PhotoRoom siempre corresponde al usuario.

## Instalaci\xF3n y ejecuci\xF3n

Proyecto activo: \`C:\\tps\\tp2_explo\`.
Repositorio: https://github.com/pedroburgosfacultad-creator/TP2_POD_Pedro_Burgos_STICKERS_2

Versi\xF3n probada: Python 3.14. Dependencia: Pillow 12.3.0, fijada en requirements.txt.
Desde la ra\xEDz del proyecto, en PowerShell:

\`\`\`powershell
python -m venv .venv
.\\.venv\\Scripts\\python.exe -m pip install -r requirements.txt
.\\.venv\\Scripts\\python.exe src/main.py
\`\`\`

Si el Python activo ya tiene Pillow instalado:

\`\`\`powershell
python src/main.py
\`\`\`

El men\xFA ofrece revisi\xF3n inicial, revisi\xF3n final y preparaci\xF3n para PhotoRoom.
Las preguntas aceptan rutas entre comillas y decimales con coma o punto. Enter
mantiene el valor indicado; Ctrl+C cancela. La lectura sigue usando \`input()\`.
No hay servidor, APIs, agentes ni servicios pagos. Tras instalar Pillow, el
an\xE1lisis y la preparaci\xF3n de carpetas funcionan sin Internet.

## Par\xE1metros y tama\xF1o f\xEDsico

El **lado mayor permitido es de 0,1 a 56 cm, inclusive**, con 4 cm por defecto.
56 cm corresponde a la plantilla m\xE1xima indicada por el usuario. El m\xEDnimo de
0,1 cm (1 mm) es un criterio pr\xE1ctico del proyecto para evitar valores absurdamente
peque\xF1os; no es una norma de impresi\xF3n. Se conserva la proporci\xF3n: no se exige
que ambos lados midan lo indicado. El programa no distribuye dise\xF1os en una plantilla.

| Par\xE1metro | Uso |
|---|---|
| \`carpeta\` | Carpeta de entrada; si se omite, abre el men\xFA |
| \`--etapa inicial\` / \`--etapa final\` | Modo de evaluaci\xF3n; con carpeta expl\xEDcita se usa final por defecto; el men\xFA propone inicial |
| \`--lado-cm\` | Lado mayor entre 0.1 y 56; por comando se usa punto decimal |
| \`--ppi\` | Referencia positiva y finita; 300 por defecto |
| \`--umbral-parcial\` | Porcentaje de semitransparencia entre 0 y 100; 20 por defecto; aplica a etapa final |
| \`--permitir-opacas\` | Desactiva el aviso por ausencia de transparencia en etapa final |
| \`--salida\` | Directorio de resultados; por defecto outputs en la ra\xEDz del proyecto |
| \`--seleccion\` | JSON descargado del HTML para preparar la carpeta de PhotoRoom; no se combina con carpeta de an\xE1lisis |

\`\`\`powershell
python src/main.py "data/muestra_jpeg_y_png" --etapa inicial --lado-cm 4 --ppi 300
python src/main.py "C:\\ruta\\a\\png_preparados" --etapa final --lado-cm 6 --umbral-parcial 25
python src/main.py --seleccion "C:\\ruta\\seleccion_photoroom.json"
\`\`\`

En el men\xFA, un tama\xF1o fuera del rango provoca una nueva pregunta. Por comando,
se informa el error sin crear resultados. NaN, infinito y tama\xF1os fuera de rango
se rechazan tambi\xE9n al llamar directamente a la funci\xF3n de evaluaci\xF3n.

## Lectura y evaluaci\xF3n

Solo se enumeran archivos del primer nivel; no se recorren subcarpetas. Las
extensiones se reconocen sin distinguir may\xFAsculas. Pillow comprueba el formato
real, verifica y decodifica la imagen. Se respeta la orientaci\xF3n EXIF.
Los originales nunca se guardan modificados.

PDF, TXT, WEBP y otros formatos quedan registrados como no procesados, sin abrirlos.
Tambi\xE9n se rechazan im\xE1genes da\xF1adas, PNG animados y tama\xF1os que exceden la
protecci\xF3n de Pillow. Un JPEG en etapa final recibe una explicaci\xF3n para usar la
etapa inicial. Un rechazo no detiene el an\xE1lisis de los otros archivos.

Para la resoluci\xF3n se usa:

\`\`\`text
lado_evaluado_px = m\xE1ximo(ancho_evaluado_px, alto_evaluado_px)
resolucion_ppi = lado_evaluado_px \xD7 2.54 / lado_cm
ancho_impresion_cm = lado_cm \xD7 ancho_evaluado_px / lado_evaluado_px
alto_impresion_cm = lado_cm \xD7 alto_evaluado_px / lado_evaluado_px
\`\`\`

PPI significa p\xEDxeles por pulgada; no es el DPI mec\xE1nico de una impresora ni el
valor de una etiqueta guardada en la imagen. Un lado de 500 px produce 317,5 PPI
a 4 cm y 158,75 PPI a 8 cm. La referencia debe acordarse con el proveedor.

El canal alpha vale 0 para transparencia total, 255 para opacidad y 1 a 254 para
transparencia parcial. El rect\xE1ngulo visible abarca todos los p\xEDxeles con alpha > 0.
Se interpreta tambi\xE9n transparencia de paleta y PNG con tRNS.

| Advertencia | Condici\xF3n |
|---|---|
| SIN_CONTENIDO_VISIBLE | No hay p\xEDxeles visibles; resoluci\xF3n y medidas de impresi\xF3n quedan vac\xEDas |
| RESOLUCION_INFERIOR_A_REFERENCIA | PPI menor que la referencia, antes de redondear |
| SIN_TRANSPARENCIA | Todos los p\xEDxeles son opacos y est\xE1 activado el aviso; solo final |
| ALTA_PROPORCION_SEMITRANSPARENTE | El porcentaje parcial supera el umbral; igual al umbral no advierte; solo final |

La transparencia total se divide por todos los p\xEDxeles; la parcial, por los visibles.
En una imagen completamente transparente, el porcentaje parcial final es 0 por
convenci\xF3n, acompa\xF1ado de SIN_CONTENIDO_VISIBLE. En inicial, los porcentajes de
transparencia no se eval\xFAan y quedan vac\xEDos.

Los totales distinguen candidatos/sin advertencias, im\xE1genes para revisar y archivos
no procesados. Los porcentajes de advertencias usan \xFAnicamente im\xE1genes le\xEDdas.
Los motivos pueden superponerse; sin im\xE1genes evaluadas el porcentaje es \xABno aplica\xBB.

## Resultados y galer\xEDa

Cada ejecuci\xF3n crea una carpeta distinta y muestra su ruta en la terminal:

\`\`\`text
outputs/analisis_FECHA_HORA/
    informe.html
    informe.csv
    miniaturas/
\`\`\`

Abrir informe.html con doble clic. Incluye miniaturas de hasta 240 px, indicadores,
filtros por estado/motivo, b\xFAsqueda y el resumen con par\xE1metros y limitaciones.
El HTML recibe los resultados en memoria; no lee el CSV para construirse.
Las miniaturas no reemplazan la revisi\xF3n del original a tama\xF1o completo.
Si una miniatura falla, se conserva la tarjeta y se informa el problema.

El CSV es una tabla por archivo para Excel, LibreOffice o futuros an\xE1lisis.
Usa UTF-8 con BOM, punto y coma como separador y punto decimal, con hasta cuatro
decimales. El diccionario est\xE1 en [data/README.md](data/README.md).
No se genera TXT; el resumen se conserva en la terminal y en el HTML.
El CSV solo no conserva el umbral parcial y la opci\xF3n de opacidad: mantener el
HTML de la misma ejecuci\xF3n para conocer todos los par\xE1metros.

Un archivo rechazado tiene estado ERROR_LECTURA en CSV y \xABNo procesado\xBB en HTML,
con explicaci\xF3n y mediciones vac\xEDas. Ese estado no implica necesariamente da\xF1o.
Los archivos no procesados no tienen casilla para PhotoRoom.

Agregar im\xE1genes requiere ejecutar nuevamente el an\xE1lisis. Para compartir el informe,
conservar toda la carpeta de ejecuci\xF3n, incluyendo miniaturas y CSV. Las rutas
locales del HTML/JSON no se adaptan autom\xE1ticamente a otra computadora.

## Preparar una selecci\xF3n para PhotoRoom

1. Marcar las casillas de las im\xE1genes elegidas en el HTML.
2. Pulsar \xABDescargar selecci\xF3n\xBB. El navegador guarda seleccion_photoroom.json.
3. Ejecutar el programa y elegir la opci\xF3n 3.
4. Elegir un JSON por n\xFAmero en la lista de Descargas, ordenada desde el m\xE1s reciente,
   o pegar su ruta si el navegador lo guard\xF3 en otra carpeta.
5. Usar las im\xE1genes de la carpeta que muestra la terminal en PhotoRoom manualmente.

\`\`\`text
outputs/seleccion_photoroom_FECHA_HORA/
    seleccion_photoroom.json
    sticker_01.jpg
    sticker_02.png
\`\`\`

Se copian los originales y una copia exacta del JSON. No se mueven ni convierten.
Descargas conserva su archivo. Cada preparaci\xF3n crea otra carpeta: repetirla ocupa
espacio adicional. La b\xFAsqueda admite los sufijos numerados del navegador y consulta
la ubicaci\xF3n de Descargas de Windows; una carpeta personalizada del navegador puede
requerir indicar la ruta manualmente.

Los filtros mantienen la selecci\xF3n, incluso cuando ocultan tarjetas. \xABQuitar selecci\xF3n\xBB
la borra; \xABLimpiar filtros\xBB no. Cerrar o recargar el HTML pierde la selecci\xF3n no descargada.
No seleccionar no significa rechazar. Seleccionar no significa que ya se proces\xF3.

Si falta un original, se informa NO COPIADO y se contin\xFAa con los dem\xE1s. El JSON
archivado registra lo solicitado, no acredita que todas las copias se completaron.
Si un original cambi\xF3, se copia su versi\xF3n actual: generar otro informe tras modificarlo.
La copia rechaza nombres que salen de la carpeta de origen y enlaces simb\xF3licos.

## L\xEDmites, GitHub y entrega

No se certifican nitidez, color, recorte ni facilidad de eliminar fondos. M\xE1rgenes,
varios dise\xF1os o p\xEDxeles aislados pueden sobreestimar la resoluci\xF3n \xFAtil. La
semitransparencia puede ser intencional; su umbral es una heur\xEDstica configurable.
No se eliminan duplicados ni se hace seguimiento de ventas o pedidos.

Las salidas, entornos y muestras privadas est\xE1n excluidos de Git. No agregar nuevas
im\xE1genes sin comprobar sus permisos de distribuci\xF3n. El c\xF3digo, requirements.txt,
documentaci\xF3n y pruebas permiten reproducir el funcionamiento sin esas muestras.

Antes de entregar, contrastar la implementaci\xF3n con la consigna, justificar la adaptaci\xF3n
del requisito de abstracci\xF3n de fuentes mediante carpeta y selecci\xF3n JSON, preparar una muestra
compartible y documentar la revisi\xF3n visual. Esta documentaci\xF3n describe lo implementado;
no sustituye la verificaci\xF3n acad\xE9mica, la evidencia de trabajo ni la defensa individual.

Para la defensa, explicar la diferencia entre etapas, PPI y nitidez, alpha, denominadores
de los porcentajes, errores por archivo y decisi\xF3n manual. El caso de una imagen borrosa
con muchos p\xEDxeles es una limitaci\xF3n del m\xE9todo, no una garant\xEDa de calidad.


## Auditor\xEDa final y ejemplo comprobado

La [auditor\xEDa final](docs/INFORME_FINAL.md) contrasta el c\xF3digo con los siete pasos
de la consigna y detalla evidencia, limitaciones, proyecci\xF3n y pendientes de entrega.

El 22/10/2026 se verificaron 47 pruebas y el flujo completo con la muestra local
mixta, que ahora incluye un PDF: 13 archivos en total. A 4 cm y 300 PPI, la etapa
inicial produjo 10 candidatos, 2 im\xE1genes para revisar y 1 archivo no procesado.
El 16,67 % corresponde a las 2 im\xE1genes con advertencias entre las 12 le\xEDdas;
no mide calidad real ni representa la colecci\xF3n completa. En final se ley\xF3 el PNG
(con dos advertencias) y se rechazaron los 11 JPEG y el PDF por formato de etapa.

Para entregar, identificar el commit definitivo con \`git rev-parse HEAD\` despu\xE9s
de confirmar y publicar los \xFAltimos cambios. El enlace solo no identifica la versi\xF3n.
El alumno confirm\xF3 que el docente solo autoriz\xF3 cambiar los datos de entrada.
El requisito de abstracci\xF3n com\xFAn de fuentes se implement\xF3 con FuenteCarpeta y
FuenteSeleccionJSON. La adaptaci\xF3n al dominio de im\xE1genes debe explicarse en la defensa.
Tambi\xE9n debe acreditarse la referencia de 50 observaciones o justificarse menos,
y garantizar datos de demostraci\xF3n autorizados y accesibles para la c\xE1tedra.


## Reanalizar una selecci\xF3n: abstracci\xF3n de fuentes

La opci\xF3n **4** del men\xFA permite elegir un JSON de Descargas (o pegar su ruta),
elegir revisi\xF3n inicial/final y definir tama\xF1o y par\xE1metros nuevos. Genera otro
HTML y CSV solo para los originales seleccionados; no copia im\xE1genes a PhotoRoom.
La opci\xF3n **3** conserva esa funci\xF3n de copia.

\`\`\`powershell
python src/main.py --analizar-seleccion "C:\\ruta\\seleccion_photoroom.json" --lado-cm 6 --etapa inicial
\`\`\`

FuenteImagenes es una clase abstracta: exige cargar(), que devuelve una lista de
rutas. FuenteCarpeta enumera archivos; FuenteSeleccionJSON lee la lista seleccionada.
analizar_fuente() usa el mismo contrato sin distinguir el tipo concreto de fuente.
Despu\xE9s se comparten lectura, evaluaci\xF3n, resumen y reportes. ImagenSticker sigue
representando cada imagen, no la fuente. No hay reglas PPI duplicadas.

Los nombres repetidos en el JSON se procesan una sola vez; no se eliminan archivos
distintos que tengan contenido id\xE9ntico. Si una imagen falta, se registra el error
y se contin\xFAa. Si el JSON est\xE1 mal formado o su carpeta original no existe, la
fuente se rechaza antes de crear informes. El resumen identifica el JSON de entrada.
El JSON no guarda los par\xE1metros del an\xE1lisis: se eligen de nuevo.
Por comando, --analizar-seleccion propone inicial; la carpeta conserva final por defecto.
No se combinan carpeta, --seleccion y --analizar-seleccion en el mismo comando.

## Procedencia y unidad de an\xE1lisis

Fuente: im\xE1genes PNG/JPEG utilizadas por Pedro Burgos en su microemprendimiento.
No se usan datos contables ni se requieren ventas simuladas. La unidad de an\xE1lisis
es un archivo est\xE1tico evaluado en una etapa y a un tama\xF1o f\xEDsico determinado.
Reanalizarlo a otro tama\xF1o no representa una venta ni un nuevo dise\xF1o.

Las im\xE1genes pueden estar en cualquier carpeta accesible. Solo se enumeran archivos
del primer nivel; los formatos no admitidos tambi\xE9n se registran como no procesados.
No se eliminan duplicados. Las im\xE1genes y miniaturas se procesan sin modificar originales.

Las muestras locales \`muestra_visual/\` y \`muestra_jpeg_y_png/\` est\xE1n ignoradas por Git.
La segunda fue aportada por el usuario con 11 JPEG y 1 PNG. La muestra visual contiene
casos reales seleccionados por advertencia y casos artificiales vac\xEDo/da\xF1ado; consultar
su README local para la selecci\xF3n. No son muestras representativas del negocio.
Las pruebas de tests generan datos artificiales temporales y no dependen de ellas.

Pertenecer a la colecci\xF3n no implica licencia de redistribuci\xF3n. Revisar los permisos
antes de compartir im\xE1genes, miniaturas o informes. Los informes y selecciones incluyen
nombres y rutas locales. Una muestra publicable debe indicar procedencia, criterio de
selecci\xF3n, cantidad y condiciones de uso.

## Diccionario de informe.csv

Cada fila corresponde a un archivo de la carpeta. El CSV se genera en outputs,
no dentro de data. Formato: UTF-8 con BOM, separador \`;\`, punto decimal y hasta
cuatro decimales. Los vac\xEDos representan datos no disponibles/no aplicables, no ceros.

| Campo | Significado |
|---|---|
| archivo | Nombre con extensi\xF3n |
| formato | PNG o JPEG verificado por contenido; vac\xEDo en archivos rechazados |
| etapa | inicial o final; vac\xEDo en archivos rechazados |
| base_resolucion | imagen_completa en inicial; rectangulo_visible en final |
| ancho_px, alto_px | Dimensiones de la imagen, respetando orientaci\xF3n EXIF |
| ancho_visible_px, alto_visible_px | Caja que contiene todos los p\xEDxeles con alpha > 0 |
| ancho_evaluado_px, alto_evaluado_px | Dimensiones utilizadas para calcular PPI seg\xFAn la etapa |
| lado_mayor_cm | Tama\xF1o f\xEDsico solicitado: de 0,1 a 56 cm, inclusive |
| ancho_impresion_cm, alto_impresion_cm | Medidas f\xEDsicas conservando proporciones; vac\xEDas sin contenido visible |
| resolucion_ppi | max(ancho_evaluado_px, alto_evaluado_px) \xD7 2.54 / lado_mayor_cm; vac\xEDo sin contenido visible |
| referencia_ppi | Referencia positiva, 300 por defecto |
| tipo_transparencia | opaca, con_transparencia, completamente_transparente o no_evaluada |
| transparentes_pct_lienzo | P\xEDxeles con alpha 0 / p\xEDxeles totales \xD7 100; solo final |
| semitransparentes_pct_visibles | P\xEDxeles con alpha 1..254 / p\xEDxeles visibles \xD7 100; solo final |
| estado | CANDIDATO, REVISAR, SIN_ADVERTENCIAS o ERROR_LECTURA |
| advertencias | Motivos separados por una barra vertical; pueden coexistir |
| observaciones | Limitaciones de interpretaci\xF3n de los resultados |
| error | Motivo del rechazo; puede ser formato incompatible o fallo de lectura |

En inicial, la transparencia no se eval\xFAa: los porcentajes quedan vac\xEDos, aunque
la ausencia total de contenido s\xED genera aviso. En final, una imagen vac\xEDa tiene
100 % de transparencia total, 0 % parcial por convenci\xF3n y resoluci\xF3n vac\xEDa.

CANDIDATO solo indica que no se activaron advertencias de la etapa inicial.
SIN_ADVERTENCIAS corresponde a la final. Ninguno certifica calidad de impresi\xF3n.
ERROR_LECTURA aparece como \xABNo procesado\xBB en HTML y no implica necesariamente da\xF1o.
Las filas rechazadas tienen mediciones vac\xEDas. Los porcentajes globales de advertencias
se calculan \xFAnicamente sobre im\xE1genes le\xEDdas; las reglas se describen en el README ra\xEDz.

El CSV no guarda el umbral parcial ni la opci\xF3n de advertir por opacidad. Conservar
el HTML correspondiente, cuyo resumen registra esos par\xE1metros y la carpeta de origen.
No combinar ejecuciones como si fueran archivos distintos sin identificar los dise\xF1os
y las condiciones de cada evaluaci\xF3n.

## Selecci\xF3n para PhotoRoom

El HTML descarga un JSON con esta estructura:

\`\`\`json
{
  "version": 1,
  "carpeta": "C:\\\\ruta\\\\a\\\\imagenes",
  "archivos": ["sticker_01.jpg", "sticker_02.png"]
}
\`\`\`

\`version\` identifica el formato; \`carpeta\` es la ruta absoluta de origen;
\`archivos\` contiene los nombres elegidos, no las im\xE1genes ni mediciones.
No registra fecha de selecci\xF3n, identificador de informe, motivos manuales ni
confirmaci\xF3n de trabajo terminado. No seleccionar no equivale a rechazar.

Python conserva una copia exacta del JSON junto a las im\xE1genes copiadas en
outputs/seleccion_photoroom_FECHA_HORA. Si falta un archivo, el JSON mantiene su
nombre y la terminal informa el fallo. Por eso es un registro de intenci\xF3n,
no una constancia de que todo se copi\xF3. No convertir sus selecciones en m\xE9tricas
de calidad o productividad sin agregar datos de revisi\xF3n manual y seguimiento.


## Constancia de revisi\xF3n de datos

Fecha de inspecci\xF3n local: 22/10/2026. No se dispone de una fecha de obtenci\xF3n
individual ni licencia de redistribuci\xF3n acreditada para cada imagen del negocio;
no se las presume abiertas. La muestra mixta conten\xEDa, al auditarla, 12 im\xE1genes
(11 JPEG y un PNG) y un PDF agregado para comprobar el rechazo de formatos.
La referencia de 50 observaciones del punto 2 de la consigna requiere documentar
una ejecuci\xF3n sobre datos autorizados o justificar un tama\xF1o menor. Los casos
temporales de los tests verifican software, no sustituyen autom\xE1ticamente esa evidencia.
Antes de entregar, acordar una muestra compartible o un procedimiento reproducible
de generaci\xF3n/obtenci\xF3n. El resultado local se documenta en el informe final.


El mismo JSON ahora sirve como fuente del rean\xE1lisis (opci\xF3n 4). No incorpora las
mediciones anteriores: se vuelven a leer los originales y se eligen par\xE1metros
nuevos. Nombres repetidos en la selecci\xF3n se procesan una vez. Esto no es una
deduplicaci\xF3n de la colecci\xF3n por contenido. El CSV tiene el mismo esquema que
al analizar una carpeta y el resumen HTML registra la ruta del JSON utilizado.
