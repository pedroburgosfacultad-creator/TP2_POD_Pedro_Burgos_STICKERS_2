Los resultados esperados se calculan con ejemplos conocidos; por ejemplo, 500 px
a 4 cm producen 317,5 PPI. Otra prueba verifica que una imagen n\xEDtida y su copia
desenfocada con iguales dimensiones obtienen igual resoluci\xF3n: documenta una limitaci\xF3n,
no demuestra capacidad de detectar nitidez.

## Interpretaci\xF3n y l\xEDmites

\`OK\` significa que pasaron los casos implementados, no que el programa carezca de
errores en todas las situaciones. Los mensajes de validaci\xF3n impresos durante las
pruebas son esperados: se introducen respuestas incorrectas para probar reintentos.
Los archivos rechazados producen salida 1 sin impedir que se generen informes;
los argumentos inv\xE1lidos producen 2 y la cancelaci\xF3n produce 130.

Las pruebas HTML comprueban contenido y archivos generados; no ejecutan JavaScript
en un navegador ni garantizan su apariencia. La apertura del navegador est\xE1 simulada.
No son pruebas de rendimiento de la colecci\xF3n completa ni de todas las variantes
posibles de PNG/JPEG. Tampoco certifican calidad visual o requisitos acad\xE9micos.

## Comprobaci\xF3n manual antes de entregar

1. Analizar una carpeta peque\xF1a con JPEG, PNG y un PDF; verificar los tres estados
   y que el PDF quede como no procesado. Repetir en etapa final.
2. Probar tama\xF1os 0,1 y 56, y comprobar que 0,01 y 57 se rechacen.
3. Abrir el HTML; probar b\xFAsqueda, filtros y selecci\xF3n. Una selecci\xF3n oculta por
   filtros debe seguir contando; limpiar filtros no debe borrarla.
4. Descargar el JSON; elegirlo en la opci\xF3n 3 y comprobar las copias y el JSON archivado.
5. En una muestra descartable, mover un original despu\xE9s del an\xE1lisis y comprobar
   que se informe como faltante sin detener las otras copias.
6. Cancelar una pregunta con Ctrl+C y comprobar que no se inici\xF3 el procesamiento.

No usar miniaturas para decidir nitidez: revisar los originales. Mantener el c\xF3digo
de pruebas sincronizado con las reglas; no debilitar una prueba solo para obtener OK.

## 1. Dictamen

El programa es funcional para el alcance acordado: inspeccionar im\xE1genes, calcular
resoluci\xF3n para un tama\xF1o f\xEDsico, evaluar transparencia en PNG preparados, comunicar
advertencias y copiar una selecci\xF3n manual para PhotoRoom. La arquitectura es
comprensible y la complejidad es razonable para las funciones elegidas.

La suite de **47 pruebas pas\xF3 sin fallos**. Se verific\xF3 adicionalmente el flujo
completo con la muestra local y copias temporales. No se detectaron fallos que
bloqueen el uso habitual de ese flujo. Esto no demuestra ausencia total de errores.

**El cierre t\xE9cnico no equivale todav\xEDa a cumplimiento acad\xE9mico completo.**
Hay asuntos que deben resolverse o acreditarse antes de presentar el TP:

1. Confirmar la adaptaci\xF3n del requisito de abstracci\xF3n de fuentes del punto 4.
2. Acreditar al menos 50 observaciones o justificar una muestra menor, y asegurar
   que la c\xE1tedra pueda obtener los datos de demostraci\xF3n de forma autorizada.
3. Confirmar y publicar los cambios finales; entregar el enlace y el identificador
   del commit evaluado, y verificar el acceso de la c\xE1tedra.

La autorizaci\xF3n docente comunicada por el alumno permite im\xE1genes en lugar de
CSV/JSON como entrada. En una aclaraci\xF3n posterior, el alumno confirm\xF3 expresamente
que el profesor solo autoriz\xF3 cambiar los datos. Por tanto, el requisito de
abstracci\xF3n com\xFAn de fuentes sigue vigente y no est\xE1 implementado. No se incorpor\xF3 una jerarqu\xEDa artificial solo para aparentar cumplimiento.

## 2. Qu\xE9 qued\xF3 aplicado y qu\xE9 se complet\xF3 en esta revisi\xF3n

## 3. Caracter\xEDsticas y arquitectura

El flujo es: enumerar archivos, leer y validar, transformar en memoria, evaluar,
resumir y exportar. La transformaci\xF3n incluye orientaci\xF3n EXIF, conversi\xF3n RGBA,
histograma alpha y rect\xE1ngulo visible; no incluye modificar los originales.

| M\xF3dulo | Responsabilidad y evaluaci\xF3n |
|---|---|
| main.py | Coordina CLI/men\xFA, resultados y c\xF3digos de salida; no concentra las reglas |
| guiado.py | Entrada con reintentos, b\xFAsqueda de JSON y apertura del informe; la parte Windows de Descargas tiene respaldo de ruta manual |
| lectura.py | Enumera, valida y obtiene mediciones; ImagenSticker agrupa atributos y m\xE9todos del dominio |
| evaluacion.py | Reglas num\xE9ricas, l\xEDmites y estad\xEDsticas; funciones verificables con datos conocidos |
| informes.py | CSV y resumen textual compartido; el texto no se guarda en un TXT separado |
| galeria.py | Miniaturas y plantilla HTML/CSS/JavaScript; concentra la mayor complejidad visual |
| seleccion.py | Valida la selecci\xF3n y copia los originales a una carpeta nueva |

Hay siete m\xF3dulos y aproximadamente **822 l\xEDneas f\xEDsicas en src**, incluyendo
comentarios, espacios y la plantilla HTML/CSS/JavaScript. El n\xFAmero de l\xEDneas no es
una medida de calidad. No se observ\xF3 otra ampliaci\xF3n desproporcionada como la del
editor de teclado que se retir\xF3 al revertir Esc.

La ordenaci\xF3n de n archivos cuesta aproximadamente O(n log n). Lectura, alpha y
miniaturas dependen sobre todo del total de p\xEDxeles; no hay un algoritmo que compare
cada imagen con todas las dem\xE1s. Se conservan mediciones por archivo, no una colecci\xF3n
completa de im\xE1genes decodificadas en memoria. Una imagen individual grande puede,
sin embargo, consumir bastante memoria. No se hizo una medici\xF3n de rendimiento del
lote completo de m\xE1s de 700 im\xE1genes en esta auditor\xEDa.

Entorno comprobado: Python 3.14.7 y Pillow 12.3.0. Pillow es la \xFAnica dependencia
externa del programa. Las herramientas usadas para leer la consigna durante la
auditor\xEDa se instalaron fuera del proyecto y no forman parte de requirements.txt.

### Aclaraci\xF3n fundamental sobre fuentes

Exportar CSV no equivale a leer una fuente CSV. Leer el JSON de una selecci\xF3n tampoco
equivale a implementar dos fuentes anal\xEDticas con una interfaz com\xFAn. Tener una clase
ImagenSticker y usar Pillow no reemplaza ese requisito de dise\xF1o.

La consigna pide que la jerarqu\xEDa sea \xFAtil, no formal. El requisito se mantiene:
se debe dise\xF1ar e implementar una interfaz com\xFAn con dos fuentes concretas.
La autorizaci\xF3n para im\xE1genes no elimina esa obligaci\xF3n. La elecci\xF3n de las dos
fuentes debe justificarse en el dominio y, si hay dudas sobre su equivalencia con
la consigna escrita, validarse con la c\xE1tedra antes de dar por cumplido el punto 4.

### Regex y limpieza, para la defensa

La expresi\xF3n \`\\\\.(png|jpe?g)\\\\Z\` en notaci\xF3n de texto representa el patr\xF3n de extensi\xF3n
usado en lectura (en el c\xF3digo se escribe \`r"\\.(png|jpe?g)\\Z"\`). Reconoce PNG/JPG/JPEG
al final del nombre sin distinguir may\xFAsculas. No certifica el contenido: Pillow lo
comprueba despu\xE9s. La b\xFAsqueda de selecciones usa otra regex para los nombres JSON
y las copias numeradas del navegador.

La limpieza consiste en rechazar entradas inv\xE1lidas con registro, normalizar la
orientaci\xF3n y obtener medidas comparables en memoria. No se eliminan duplicados;
cada archivo cuenta. Los valores no aplicables quedan vac\xEDos y los porcentajes usan
denominadores expl\xEDcitos. No se inventan valores para im\xE1genes ilegibles.

| Alta para entrega | Cambios locales no incluidos en el remoto | La c\xE1tedra no recibir\xEDa la versi\xF3n auditada si se entrega el enlace actual sin commit/push |
| Media | El CSV omite umbral parcial y opci\xF3n de opacidad | Conservar el HTML correspondiente para interpretar todos los par\xE1metros; posible mejora peque\xF1a futura |
| Baja, reproducible | casefold() en Python y min\xFAsculas en JavaScript no son equivalentes | Una b\xFAsqueda con ciertos caracteres, por ejemplo Stra\xDFe, puede no encontrar el nombre; no afecta los c\xE1lculos |
| Limitaci\xF3n funcional | P\xEDxeles suficientes no equivalen a nitidez | CANDIDATO requiere revisi\xF3n humana; las capturas ampliadas son un caso conocido |
| Limitaci\xF3n funcional | El JSON no identifica informe, fecha ni revisi\xF3n manual | No usarlo como registro completo de calidad o productividad |
| Limitaci\xF3n operativa | El original puede cambiar despu\xE9s de analizarse | La copia usa su contenido actual; regenerar el informe tras modificaciones |
| Limitaci\xF3n operativa | Interrupci\xF3n o error de escritura puede dejar salidas parciales | Revisar mensajes y repetir; no se promete una operaci\xF3n transaccional |

La detecci\xF3n de opacidad no juzga si el dise\xF1o debe tener fondo. El rect\xE1ngulo visible
puede ampliarse por p\xEDxeles aislados. La transparencia parcial puede ser v\xE1lida. Las
miniaturas reducidas no son una prueba fiable de detalle de impresi\xF3n.

Un caso t\xE9cnico adicional poco habitual es analizar enlaces simb\xF3licos a archivos:
la lectura puede seguirlos, mientras la copia los rechaza; adem\xE1s, la ruta de origen
del HTML se deriva de la primera imagen resuelta. Utilizar archivos ordinarios del
mismo directorio para este flujo. No se verific\xF3 compatibilidad con ese escenario.

Los defectos menores ya conocidos no se ocultaron ni se marcaron como corregidos.
No se agregaron funciones ajenas al alcance para cerrar artificialmente la auditor\xEDa.

## 7. Entrega y defensa: acciones concretas

El punto 7 admite una estructura equivalente: los nombres fuentes.py/pipeline.py
son ejemplos, no obligan a renombrar m\xF3dulos. Lo que s\xED importa es implementar y
explicar las responsabilidades y requisitos.

Antes de entregar:

1. Resolver los pendientes acad\xE9micos de fuentes y datos; registrar la aclaraci\xF3n
   docente con sus t\xE9rminos reales, sin afirmar una excepci\xF3n que no existe.
2. Revisar los cambios y ejecutar la suite desde un entorno con requirements.txt.
3. Confirmar los archivos de c\xF3digo, tests, README e informe; no incluir im\xE1genes
   restringidas, outputs, cach\xE9s ni entornos. Revisar con \`git status\` y \`git diff\`.
4. Hacer commit y push desde VS Code o Git. Obtener \`git rev-parse HEAD\` despu\xE9s
   del commit definitivo y consignarlo en la entrega por EVA junto al enlace.
5. Comprobar acceso al repositorio desde la cuenta prevista para la evaluaci\xF3n.
   El remoto respondi\xF3 durante la auditor\xEDa, pero eso no prueba acceso de la c\xE1tedra.

Guion sugerido de demostraci\xF3n breve:

- Presentar problema, usuario y pregunta; explicar que no es un detector de nitidez.
- Analizar una muestra peque\xF1a inicial y mostrar un candidato, un aviso y un PDF rechazado.
- Explicar una cuenta PPI y el cambio de criterio de transparencia en etapa final.
- Seleccionar un archivo, descargar el JSON y preparar la carpeta para PhotoRoom.
- Mostrar una prueba significativa y su propiedad, y recorrer commits de cambios reales.

Preparar respuestas sobre alpha, PPI frente a DPI, m\xE9todos de ImagenSticker,
validaciones, regex frente a formato real, c\xF3digos de salida, duplicados y CSV/JSON.
La consigna tambi\xE9n contempla preguntas del TP1 para quienes deban recuperar esa
exposici\xF3n; solo corresponde si aplica a la situaci\xF3n acad\xE9mica del alumno.
